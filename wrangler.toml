name = "ogame-api"
main = "worker/index.js"
compatibility_date = "2026-07-25"

# The proxy is stateless and read-only: no KV, no D1, no secrets. Caching is
# handled by the Cloudflare edge through the `cf.cacheTtl` hint in the worker.

[vars]
# Comma-separated allowlist, or "*" to answer any caller. A listed origin is
# echoed back, since a browser rejects a list. Note this only constrains
# browsers: CORS is not an authentication mechanism.
# The site lives on its own domain (public/CNAME, `homepage` in package.json).
# The old blog.rolljee.fr/ogame-ui and rolljee.github.io origins now redirect
# there, but stay listed so a cached old page keeps working meanwhile.
ALLOWED_ORIGIN = "https://ogame.rolljee.fr, https://blog.rolljee.fr, https://rolljee.github.io, http://localhost:3000"

[observability]
enabled = true
