name: Deploy to GitHub Pages

on:
  # master is the release branch: whatever lands here goes live
  push:
    branches:
      - master
  # Allow manual runs from the Actions tab
  workflow_dispatch:

# Prevent overlapping deploys
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # needed to push the built site to the gh-pages branch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Re-run them here too: a broken build must never reach the live site,
      # even when master is pushed to directly.
      - name: Unit & component tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
