name: CI

on:
  # Every pull request, whatever it targets
  pull_request:
  # And the integration branch itself
  push:
    branches:
      - develop
  workflow_dispatch:

# One run per branch/PR is enough; drop the older ones
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    # No deployment here: this job only proves the app still builds
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
